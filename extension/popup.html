<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chatshouse Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 300px; min-height: 200px; background: #0f1117; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  .header { background: #1a1d2e; padding: 12px 14px; border-bottom: 1px solid #2e3155; display: flex; align-items: center; gap: 8px; }
  .logo { font-weight: 700; color: #6c63ff; font-size: 14px; }
  .logo span { color: #e2e8f0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
  .dot-on { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .dot-off { background: #ef4444; }
  .status-text { font-size: 11px; color: #8892a4; }
  .section { padding: 10px 14px; border-bottom: 1px solid #1a1d2e; }
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #8892a4; margin-bottom: 7px; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; }
  .stat-box { background: #1a1d2e; border: 1px solid #2e3155; border-radius: 7px; padding: 7px; text-align: center; }
  .stat-n { font-size: 18px; font-weight: 700; line-height: 1; }
  .stat-l { font-size: 9px; color: #8892a4; margin-top: 2px; }
  .n-purple { color: #6c63ff; } .n-green { color: #22c55e; } .n-red { color: #ef4444; } .n-yellow { color: #f59e0b; }
  .alert-item { background: #1a1d2e; border-radius: 6px; padding: 6px 10px; margin-bottom: 5px; border-left: 2px solid #2e3155; font-size: 11px; }
  .alert-item.high { border-left-color: #ef4444; }
  .alert-item.medium { border-left-color: #f59e0b; }
  .btn { width: 100%; padding: 9px; background: #6c63ff; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn:hover { opacity: 0.85; }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; background: #252840; border: 1px solid #2e3155; color: #e2e8f0; cursor: pointer; }
  .footer { padding: 10px 14px; }
  .config-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .config-input { flex: 1; background: #252840; border: 1px solid #2e3155; color: #e2e8f0; padding: 4px 8px; border-radius: 6px; font-size: 11px; outline: none; }
  .config-input:focus { border-color: #6c63ff; }
  .config-label { font-size: 11px; color: #8892a4; min-width: 60px; }
  .empty { text-align: center; color: #8892a4; padding: 10px; font-size: 12px; }
  .worker-id { font-size: 10px; color: #8892a4; margin-top: 4px; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">Chat<span>Monitor</span></div>
  <div class="status-text" id="status-text">Connecting...</div>
  <div class="status-dot dot-off" id="status-dot"></div>
</div>

<div class="section">
  <div class="section-title">My Stats</div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-n n-purple" id="s-profiles">—</div><div class="stat-l">Profiles</div></div>
    <div class="stat-box"><div class="stat-n n-purple" id="s-dialogs">—</div><div class="stat-l">Dialogs</div></div>
    <div class="stat-box"><div class="stat-n n-green" id="s-online">—</div><div class="stat-l">Online</div></div>
    <div class="stat-box"><div class="stat-n n-red" id="s-urgent">—</div><div class="stat-l">Urgent</div></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Recent Alerts</div>
  <div id="alerts-list"><div class="empty">No alerts</div></div>
</div>

<div class="section">
  <div class="section-title">Settings</div>
  <div class="config-row">
    <span class="config-label">Your name</span>
    <input class="config-input" id="worker-name" type="text" placeholder="e.g. Anna">
  </div>
  <div class="config-row">
    <span class="config-label">Backend</span>
    <input class="config-input" id="backend-url" type="text" placeholder="http://localhost:4000">
  </div>
  <div class="config-row">
    <button class="btn-sm" onclick="saveConfig()">Save</button>
    <span id="config-status" style="font-size:10px;color:#22c55e"></span>
  </div>
  <div class="worker-id" id="worker-id-display"></div>
</div>

<div class="footer">
  <button class="btn" onclick="openPanel()">📊 Open Admin Panel</button>
</div>

<script src="popup.js"></script>
</body>
</html>
